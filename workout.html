<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筋トレ管理アプリ</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div class="app">
        <header class="header">
            <button class="back-btn">←</button>

        </header>

        <main class="menu-page">

            <div class="workout-title">
                <h2>ワークアウト開始</h2>
                <p>今日はどこを鍛えますか？</p>
            </div>

            <section class="workout-list">

                <a href="record.html" class="workout-card">
                    <div class="workout-icon">💪</div>

                    <div class="workout-info">
                        <h3>胸の日</h3>
                        <p>4種目</p>
                    </div>

                    <span>開始</span>
                </a>

                <a href="#" class="workout-card">
                    <div class="workout-icon">🪽</div>

                    <div class="workout-info">
                        <h3>背中の日</h3>
                        <p>5種目</p>
                    </div>

                    <span>開始</span>
                </a>

                <a href="#" class="workout-card">
                    <div class="workout-icon">🏋️</div>

                    <div class="workout-info">
                        <h3>肩の日</h3>
                        <p>4種目</p>
                    </div>

                    <span>開始</span>
                </a>

                <a href="#" class="workout-card">
                    <div class="workout-icon">🦵</div>

                    <div class="workout-info">
                        <h3>脚の日</h3>
                        <p>6種目</p>
                    </div>

                    <span>開始</span>
                </a>

            </section>
        

        </main>

        <nav class="bottom-nav">

            <a href="#" class="nav-item active">
                <span>🏠</span>
                <small>ホーム</small>
            </a>

            <a href="#" class="nav-item">
                <span>📋</span>
                <small>メニュー</small>
            </a>

            <a href="#" class="nav-item record-btn">
                <span>＋</span>
            </a>

            <a href="#" class="nav-item">
                <span>📈</span>
                <small>グラフ</small>
            </a>

            <a href="#" class="nav-item">
                <span>👤</span>
                <small>マイページ</small>
            </a>

        </nav>

    </div>

    <script src="./app.js"></script>
</body>
</html>
