<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筋トレ管理アプリ</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app">
        <header class="header">
           <button class="back-btn">←</button>


        </header>
    
        <main class="record-page">

            <div class="record-header">
                <h2>トレーニング記録</h2>
                <p>今日のトレーニングを記録しましょう</p>
            </div>

            <section class="record-form">

                <div class="input-group">
                    <label>種目名</label>
                    <input
                        type="text"
                        placeholder="例：ベンチプレス"
                    >
                </div>

                <div class="input-group">
                    <label>重量</label>

                    <div class="input-unit">
                        <input
                            type="number"
                            placeholder="80"
                        >
                        <span>kg</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>回数</label>

                    <div class="input-unit">
                        <input
                            type="number"
                            placeholder="8"
                        >
                        <span>回</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>セット数</label>

                    <div class="input-unit">
                        <input
                            type="number"
                            placeholder="3"
                        >
                        <span>セット</span>
                    </div>
                </div>

                <button class="recordBtn">
                    記録する
                </button>

            </section>

        </main>

        <nav class="bottom-nav">

            <a href="#" class="nav-item active">
                <span>🏠</span>
                <small>ホーム</small>
            </a>

            <a href="#" class="nav-item">
                <span>📋</span>
                <small>メニュー</small>
            </a>

            <a href="#" class="nav-item record-btn">
                <span>＋</span>
            </a>

            <a href="#" class="nav-item">
                <span>📈</span>
                <small>グラフ</small>
            </a>

            <a href="#" class="nav-item">
                <span>👤</span>
                <small>マイページ</small>
            </a>

        </nav>

    </div>

    <script src="./app.js"></script>
</body>
</html>
