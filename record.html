<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筋トレ管理アプリ</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app">
        <header class="header">
           <button class="back-btn">←</button>

                <h2>胸の日</h2>

                <button class="more-btn">⋮</button>
        </header>
    
        <main class="menu-home">

            <div class="record-title">
                <h2>ベンチプレス</h2>
                <p>今日のトレーニングを記録</p>
            </div>

            <form class="record-form">

                <label>重量 (kg)</label>
                <input type="number" placeholder="60">

                <label>回数</label>
                <input type="number" placeholder="10">

                <label>セット数</label>
                <input type="number" placeholder="3">

                <label>メモ</label>
                <textarea placeholder="メモを入力"></textarea>

                <button type="submit">
                    記録する
                </button>

            </form>

        </main>

        <nav class="bottom-nav">

            <a href="#" class="nav-item active">
                <span>🏠</span>
                <small>ホーム</small>
            </a>

            <a href="#" class="nav-item">
                <span>📋</span>
                <small>メニュー</small>
            </a>

            <a href="#" class="nav-item record-btn">
                <span>＋</span>
            </a>

            <a href="#" class="nav-item">
                <span>📈</span>
                <small>グラフ</small>
            </a>

            <a href="#" class="nav-item">
                <span>👤</span>
                <small>マイページ</small>
            </a>

        </nav>

    </div>

    <script src="./app.js"></script>
</body>
</html>
