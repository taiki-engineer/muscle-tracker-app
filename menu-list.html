<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筋トレ管理アプリ</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div class="app">
        <header class="header">
            <button class="menu-btn">☰</button>

            <h2>ホーム</h2>

            <button class="bell-btn">🔔</button>
        </header>

        <main class="menu-page">

            <div class="menu-title">
                <h2>メニュー</h2>
                <p>鍛えたい部位を選択してください</p>
            </div>

            <section class="body-list">

                <a href="menu.html" class="body-card">
                    <div class="body-icon">💪</div>

                    <div class="body-info">
                        <h3>胸の日</h3>
                        <p>4種目</p>
                    </div>

                    <span>›</span>
                </a>

                <a href="#" class="body-card">
                    <div class="body-icon">🪽</div>

                    <div class="body-info">
                        <h3>背中の日</h3>
                        <p>5種目</p>
                    </div>

                    <span>›</span>
                </a>

                <a href="#" class="body-card">
                    <div class="body-icon">🏋️</div>

                    <div class="body-info">
                        <h3>肩の日</h3>
                        <p>4種目</p>
                    </div>

                    <span>›</span>
                </a>

                <a href="#" class="body-card">
                    <div class="body-icon">🦵</div>

                    <div class="body-info">
                        <h3>脚の日</h3>
                        <p>6種目</p>
                    </div>

                    <span>›</span>
                </a>

                <a href="#" class="body-card">
                    <div class="body-icon">💪</div>

                    <div class="body-info">
                        <h3>腕の日</h3>
                        <p>3種目</p>
                    </div>

                    <span>›</span>
                </a>

            </section>
        

        </main>

        <nav class="bottom-nav">

            <a href="#" class="nav-item active">
                <span>🏠</span>
                <small>ホーム</small>
            </a>

            <a href="#" class="nav-item">
                <span>📋</span>
                <small>メニュー</small>
            </a>

            <a href="#" class="nav-item record-btn">
                <span>＋</span>
            </a>

            <a href="#" class="nav-item">
                <span>📈</span>
                <small>グラフ</small>
            </a>

            <a href="#" class="nav-item">
                <span>👤</span>
                <small>マイページ</small>
            </a>

        </nav>

    </div>

    <script src="./app.js"></script>
</body>
</html>
